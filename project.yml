name: PaperTokReader
options:
  bundleIdPrefix: ai.papertok
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.4"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: "PaperTok Reader"

packages:
  PTCore:
    path: Packages/PTCore
  PTNetworking:
    path: Packages/PTNetworking
  PTReader:
    path: Packages/PTReader
  PTUI:
    path: Packages/PTUI
  PTAIServices:
    path: Packages/PTAIServices
  PTFeatures:
    path: Packages/PTFeatures

targets:
  PaperTokReader:
    type: application
    platform: iOS
    sources:
      - path: App
        type: group
    dependencies:
      - package: PTFeatures
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: ai.papertok.paperreader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: true
        CODE_SIGN_ENTITLEMENTS: App/Entitlements/iOS.entitlements
    entitlements:
      path: App/Entitlements/iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.papertok.paperreader
        keychain-access-groups:
          - $(AppIdentifierPrefix)ai.papertok.paperreader
